name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run Python unit tests
        run: |
          python -m compileall -q mycar
          python -m unittest discover -s tests -v
      - name: Simulator smoke test
        run: |
          python -c "from mycar.sim import SimConnection; c = SimConnection(time_scale=10.0); assert c.query_mode01('05', 1) is not None; print('Sim smoke OK')"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify i18n and font-floor guards
        run: |
          if grep -rn '[А-Яа-яЁё]' android/app/src/main/java/; then exit 1; fi
          if grep -nE '\b([0-9]|1[01])\.sp' android/app/src/main/java/com/alexqem/chr/ui/DashboardScreen.kt; then exit 1; fi
      - name: Connectivity probe for KSP POM
        run: |
          curl -sI https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.0-1.0.22/com.google.devtools.ksp.gradle.plugin-2.0.0-1.0.22.pom | head -n 5
          curl -sI https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.0-1.0.22/com.google.devtools.ksp.gradle.plugin-2.0.0-1.0.22.pom | head -n 5
      - name: Run unit tests, lint, debug & R8 release builds
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload debug APK artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: chrtweaker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
